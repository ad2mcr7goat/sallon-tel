<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Salon Beauty Touch</title>

    <style>
        body {
            background-color: #e1c5e3;
            color: black;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            text-align: center;
            font-size: 45px;
            margin: 20px 0 30px 0;
        }

        .description {
            font-size: 20px;
            text-align: center;
            max-width: 900px;
            margin: 0 auto 40px auto;
            line-height: 1.5;
        }

        .videos {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        video {
            width: 300px;
            max-width: 100%;
            height: auto;
        }

        .links {
            text-align: center;
            margin: 30px 0;
        }

        .links a {
            display: block;
            margin: 20px auto;
            color: black;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .services {
            text-align: center;
            margin-top: 40px;
        }

        .services h2 {
            font-size: 25px;
        }

        .services img {
            width: 200px;
            max-width: 90%;
            height: auto;
        }

        /* 📱 TELEPHONE */
        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            h1 {
                font-size: 32px;
                margin-top: 10px;
            }

            .description {
                font-size: 17px;
                margin-bottom: 30px;
            }

            .videos {
                flex-direction: column;
                align-items: center;
                gap: 20px;
            }

            video {
                width: 100%;
                max-width: 350px;
            }

            .links a {
                font-size: 16px;
                padding: 0 10px;
            }

            .services h2 {
                font-size: 22px;
            }

            .services img {
                width: 90%;
                max-width: 300px;
            }
        }
    </style>
</head>

<body>

    <h1>Salon Beauty Touch</h1>

    <div class="description">
        A modern, premium hair salon in Morocco, where expert hairstylists,
        creativity, and exceptional service come together to bring your style to life.
    </div>

    <div class="videos">

        <video controls>
            <source src="video1.mp4" type="video/mp4">
        </video>

        <video controls>
            <source src="video2.mp4" type="video/mp4">
        </video>

        <video controls>
            <source src="video3.mp4" type="video/mp4">
        </video>

    </div>

    <div class="links">

        <a href="https://maps.app.goo.gl/W2PsW5jBtmXiF1Rr6">
            📍 LOCALISATION
        </a>

        <a href="https://github.com/ad2mcr7goat/sallon/releases/download/v.01/prices.jpeg">
            💇 DOWNLOAD SERVICES AND THEIR PRICES
        </a>

    </div>

    <div class="services">

        <h2>Services and prices</h2>

        <img src="prices.jpeg" alt="Services and prices">

    </div>

</body>
</html>
